services:
  # Backend Service
  - type: web
    name: fleet-backend
    runtime: node
    plan: free
    buildCommand: cd fleet_backend && npm install
    startCommand: cd fleet_backend && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fleet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: fleet-dashboard
          envVarKey: RENDER_EXTERNAL_URL

  # Frontend Service
  - type: web
    name: fleet-dashboard
    runtime: static
    buildCommand: cd fleet_dashboard && npm install && npm run build
    staticPublishPath: fleet_dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: fleet-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: fleet-db
    databaseName: fleet_db
    user: fleet_user
    plan: free
